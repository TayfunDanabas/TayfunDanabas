<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Fullstack overview: Frontend (Angular, TypeScript, JavaScript, HTML, CSS), Backend (Python), Tooling (Git, GitHub, VS Code, Figma)">

  
